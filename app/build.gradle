apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.bible.reader'

    defaultConfig {
        applicationId "com.bible.reader"
        minSdkVersion 17
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        noCompress 'SQLite3'
    }
}

dependencies {
}
